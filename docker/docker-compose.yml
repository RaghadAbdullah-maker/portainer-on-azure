services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    command: --ssl

  nginx-demo:
    image: nginx:stable
    container_name: nginx-demo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:80"

volumes:
  portainer_data:
    driver: local